name: EAS Update

on:
  push:
    branches:
      - development
      - Production

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --no-coverage --ci --forceExit

      - name: Expo public config
        run: npx expo config --type public

  publish:
    name: publish
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: eas-update-publish-${{ github.ref_name == 'Production' && 'production' || 'preview' }}
      cancel-in-progress: false
    steps:
      - name: Resolve channel
        id: target
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "development" ]; then
            CHANNEL="preview"
            ENVIRONMENT="preview"
            PROFILE="preview"
          elif [ "$BRANCH" = "Production" ]; then
            CHANNEL="production"
            ENVIRONMENT="production"
            PROFILE="production-apk"
          else
            echo "Refusing to publish from unexpected branch ${BRANCH}."
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Git branch ${BRANCH} publishes EAS channel ${CHANNEL} with environment ${ENVIRONMENT} via profile ${PROFILE}."

      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Confirm checked-out SHA
        run: |
          set -euo pipefail
          CHECKED="$(git rev-parse HEAD)"
          echo "Validated publish SHA: ${GITHUB_SHA}"
          echo "Checked-out SHA: ${CHECKED}"
          if [ "$CHECKED" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out commit ${CHECKED} is not the validated SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add an EXPO_TOKEN repository secret. Do not commit Expo tokens or expose them to pull-request jobs."
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish compatible EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ steps.target.outputs.channel }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          PROFILE: ${{ steps.target.outputs.profile }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          redact() {
            sed -E \
              -e 's/[Aa]uthorization:[[:space:]]*Bearer[[:space:]]+[^[:space:]]+/Authorization: Bearer [redacted]/g' \
              -e 's/eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/[redacted-jwt]/g' \
              -e 's/(EXPO_TOKEN|SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE)[=:][^[:space:]]+/\1=[redacted]/g' \
              -e 's/(token|secret|password)["=:[:space:]]+[^[:space:]"]{8,}/\1=[redacted]/Ig'
          }

          echo "EAS CLI version:"
          eas --version
          echo
          echo "eas fingerprint:generate --help:"
          eas fingerprint:generate --help
          echo
          echo "Selected Git branch: ${GITHUB_REF_NAME}"
          echo "EAS Update channel: ${CHANNEL}"
          echo "EAS environment for eas update: ${ENVIRONMENT}"
          echo "EAS build profile for fingerprint: ${PROFILE}"

          node <<'NODE'
          const fs = require('fs');
          const profileName = process.env.PROFILE;
          const expectedEnv = process.env.ENVIRONMENT;
          if (!fs.existsSync('eas.json')) {
            console.error(`::error::eas.json is missing on commit ${process.env.GIT_SHA}.`);
            console.error(`Build profile "${profileName}" and EAS environment "${expectedEnv}" cannot be applied.`);
            console.error('Fingerprint generation and eas update would not match a preview/production APK profile.');
            process.exit(1);
          }
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const seen = new Set();
          function resolveProfile(name) {
            if (seen.has(name)) throw new Error(`eas.json build profile "${name}" has a circular extends chain.`);
            seen.add(name);
            const profile = eas.build?.[name];
            if (!profile) throw new Error(`eas.json has no build profile named "${name}".`);
            if (profile.extends) return { ...resolveProfile(profile.extends), ...profile };
            return profile;
          }
          let resolved;
          try {
            resolved = resolveProfile(profileName);
          } catch (error) {
            console.error(`::error::${error.message}`);
            console.error(`Available profiles: ${Object.keys(eas.build || {}).join(', ') || '(none)'}`);
            process.exit(1);
          }
          const profileEnv = resolved.environment || null;
          const profileChannel = resolved.channel || null;
          console.log(`Resolved profile ${profileName}: channel=${profileChannel || '(none)'} environment=${profileEnv || '(none)'}`);
          if (profileEnv !== expectedEnv) {
            console.error(`::error::Build profile "${profileName}" environment is "${profileEnv}", but eas update will use --environment ${expectedEnv}.`);
            process.exit(1);
          }
          if (profileChannel && profileChannel !== process.env.CHANNEL) {
            console.error(`::error::Build profile "${profileName}" channel is "${profileChannel}", but this workflow publishes --channel ${process.env.CHANNEL}.`);
            process.exit(1);
          }
          NODE

          HELP="$(eas fingerprint:generate --help 2>&1 || true)"
          FP_ARGS=(--platform android --json --non-interactive)
          if echo "$HELP" | grep -q -- '--build-profile'; then
            FP_ARGS+=(--build-profile "$PROFILE")
            echo "Using fingerprint flag --build-profile ${PROFILE} (binds the profile EAS environment without --environment JSON corruption)."
          elif echo "$HELP" | grep -Eq -- '-e, --build-profile|-e[[:space:]]'; then
            FP_ARGS+=(-e "$PROFILE")
            echo "Using fingerprint flag -e ${PROFILE}."
          else
            echo "::error::Installed EAS CLI does not advertise a build-profile flag for fingerprint:generate."
            echo "Refusing to generate a fingerprint without applying profile ${PROFILE}."
            exit 1
          fi

          FP_JSON="$(mktemp)"
          BUILDS_JSON="$(mktemp)"
          LATEST_JSON="$(mktemp)"
          trap 'rm -f "$FP_JSON" "$BUILDS_JSON" "$LATEST_JSON"' EXIT
          echo "Generating Android fingerprint: eas fingerprint:generate ${FP_ARGS[*]}"
          set +e
          eas fingerprint:generate "${FP_ARGS[@]}" > "$FP_JSON"
          FP_STATUS=$?
          set -e
          if [ "$FP_STATUS" -ne 0 ]; then
            echo "::error::eas fingerprint:generate failed with exit code ${FP_STATUS}."
            echo "Command stdout (secrets redacted):"
            if [ -s "$FP_JSON" ]; then
              redact < "$FP_JSON"
            else
              echo "(empty stdout)"
            fi
            echo "stderr was streamed above. This commit was not published."
            exit "$FP_STATUS"
          fi

          HASH="$(
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync(process.argv[1], "utf8");
              if (!raw.trim()) {
                console.error("::error::fingerprint JSON file was empty.");
                process.exit(1);
              }
              let parsed;
              try {
                parsed = JSON.parse(raw);
              } catch (error) {
                const start = raw.search(/[\[{]/);
                if (start < 0) {
                  console.error(`::error::fingerprint output was not JSON (${error.message}).`);
                  process.exit(1);
                }
                try {
                  parsed = JSON.parse(raw.slice(start));
                  console.error("Warning: ignored leading non-JSON before the fingerprint object.");
                } catch (inner) {
                  console.error(`::error::Could not parse fingerprint JSON (${inner.message}). Top-level keys unavailable.`);
                  process.exit(1);
                }
              }
              const hash =
                (parsed && typeof parsed.hash === "string" && parsed.hash) ||
                (parsed && typeof parsed.fingerprintHash === "string" && parsed.fingerprintHash) ||
                (parsed && parsed.fingerprint && typeof parsed.fingerprint.hash === "string" && parsed.fingerprint.hash) ||
                null;
              if (!hash) {
                const keys = parsed && typeof parsed === "object" && !Array.isArray(parsed)
                  ? Object.keys(parsed).join(", ")
                  : `type=${Array.isArray(parsed) ? "array" : typeof parsed}`;
                console.error(`::error::Fingerprint JSON parsed but had no hash. Top-level keys/type: ${keys}`);
                process.exit(1);
              }
              process.stdout.write(hash);
            ' "$FP_JSON"
          )"
          echo "Android fingerprint: ${HASH}"

          echo "Looking up finished Android builds for this fingerprint..."
          set +e
          eas build:list --platform android --fingerprint-hash "$HASH" --status finished --limit 20 --json --non-interactive > "$BUILDS_JSON"
          BUILDS_STATUS=$?
          set -e
          if [ "$BUILDS_STATUS" -ne 0 ]; then
            echo "::error::eas build:list failed with exit code ${BUILDS_STATUS}."
            echo "Command stdout (secrets redacted):"
            if [ -s "$BUILDS_JSON" ]; then
              redact < "$BUILDS_JSON"
            else
              echo "(empty stdout)"
            fi
            exit "$BUILDS_STATUS"
          fi

          MATCH_COUNT="$(
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync(process.argv[1], "utf8").trim() || "[]";
              let parsed;
              try {
                parsed = JSON.parse(raw);
              } catch (error) {
                console.error(`::error::Could not parse eas build:list JSON (${error.message}).`);
                process.exit(1);
              }
              const builds = Array.isArray(parsed) ? parsed : parsed.builds || parsed.data || [];
              if (!Array.isArray(builds)) {
                const keys = parsed && typeof parsed === "object" ? Object.keys(parsed).join(", ") : typeof parsed;
                console.error(`::error::eas build:list JSON did not contain a builds array. Top-level keys/type: ${keys}`);
                process.exit(1);
              }
              process.stdout.write(String(builds.length));
            ' "$BUILDS_JSON"
          )"
          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "::error::No finished Android build matches fingerprint ${HASH}."
            echo "This JavaScript change requires a new native runtime/build."
            echo "Installed APKs on channel ${CHANNEL} will not receive it."
            echo "Build and install a replacement binary with the same package id and signing identity from a clean git tree:"
            echo "  npx eas-cli@latest build --profile ${PROFILE} --platform android"
            echo "Then republish this commit after that APK finishes."
            echo "EAS Build uploads modified tracked files. Uncommitted icon, splash, or app.json native changes in that upload will not match this commit's fingerprint."

            echo "Comparing this commit's fingerprint to the latest finished ${PROFILE} Android build on channel ${CHANNEL}..."
            set +e
            eas build:list --platform android --build-profile "$PROFILE" --channel "$CHANNEL" --status finished --limit 1 --json --non-interactive > "$LATEST_JSON"
            LATEST_STATUS=$?
            set -e
            if [ "$LATEST_STATUS" -ne 0 ] || [ ! -s "$LATEST_JSON" ]; then
              echo "Could not list a latest ${PROFILE} Android build for source comparison."
            else
              OTHER_HASH="$(
                node -e '
                  const fs = require("fs");
                  const raw = fs.readFileSync(process.argv[1], "utf8").trim() || "[]";
                  let parsed;
                  try {
                    parsed = JSON.parse(raw);
                  } catch (error) {
                    console.error(`Could not parse latest-build JSON (${error.message}).`);
                    process.exit(0);
                  }
                  const builds = Array.isArray(parsed) ? parsed : parsed.builds || parsed.data || [];
                  const build = builds[0];
                  if (!build) process.exit(0);
                  const hash =
                    (build.fingerprint && typeof build.fingerprint.hash === "string" && build.fingerprint.hash) ||
                    (typeof build.fingerprintHash === "string" && build.fingerprintHash) ||
                    (typeof build.runtimeVersion === "string" && build.runtimeVersion) ||
                    "";
                  const id = build.id || "(unknown id)";
                  const git = build.gitCommitHash || build.gitCommit || "(unknown git)";
                  console.error(`Latest ${process.env.PROFILE} Android build ${id} git ${git} fingerprint ${hash || "(none)"}`);
                  process.stdout.write(hash);
                ' "$LATEST_JSON"
              )"
              if [ -z "$OTHER_HASH" ]; then
                echo "Latest finished ${PROFILE} Android build had no fingerprint hash to compare."
              elif [ "$OTHER_HASH" = "$HASH" ]; then
                echo "Latest finished ${PROFILE} Android build already reports fingerprint ${HASH}; matching-build lookup returned none."
              else
                echo "Fingerprint source diff versus latest ${PROFILE} APK (generated ${HASH} vs build ${OTHER_HASH}):"
                set +e
                eas fingerprint:compare "$HASH" "$OTHER_HASH" --non-interactive
                set -e
              fi
            fi
            exit 1
          fi
          echo "Found ${MATCH_COUNT} finished Android build(s) for this fingerprint."

          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          TIP="$(git rev-parse "origin/${BRANCH}")"
          CHECKED="$(git rev-parse HEAD)"
          echo "Branch-tip check immediately before eas update."
          echo "Validated SHA: ${GITHUB_SHA}"
          echo "Checked-out SHA: ${CHECKED}"
          echo "Branch tip: ${TIP}"
          if [ "$CHECKED" != "$GITHUB_SHA" ] || [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "Skipping eas update so an older queued commit cannot replace ${TIP}."
            exit 0
          fi

          echo "Publishing ${GIT_SHA} with eas update --channel ${CHANNEL} --environment ${ENVIRONMENT} --platform android"
          eas update \
            --channel "$CHANNEL" \
            --environment "$ENVIRONMENT" \
            --platform android \
            --message "sha:${GIT_SHA}" \
            --non-interactive
          echo "Published to channel ${CHANNEL} with EAS environment ${ENVIRONMENT}."
          echo "Installed APKs with fingerprint ${HASH} can download this update."
